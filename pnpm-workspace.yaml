packages:
  - 'packages/*'
  - 'playgrounds/*'

# 以下这几项在 pnpm@10 之前是写在 .npmrc 里的，从 pnpm@11 起 .npmrc 只保留
# auth/registry 设置，其余全部迁到这里（见 https://pnpm.io/settings）。
# engineStrict 关掉：engines.node 只是给贡献者的建议范围，不该因为某个
# devDependency（如 @changesets/cli）自己声明的窄区间就硬挡所有命令。
engineStrict: false
autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: false
publicHoistPattern:
  - '@types/*'
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: true
